events { worker_connections 1024; }

http {
    # HTTP: ACME challenge passthrough + redirect to HTTPS
    server {
        listen 80;
        server_name zhangfanglong.click;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: SSL termination + proxy to Next.js
    server {
        listen 443 ssl;
        server_name zhangfanglong.click;

        ssl_certificate     /etc/letsencrypt/live/zhangfanglong.click/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zhangfanglong.click/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location / {
            proxy_pass         http://chat-app:3001;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Required for streaming responses (Bedrock SSE)
            proxy_buffering    off;
            proxy_read_timeout 300s;
        }
    }
}
