services:
  chat-app:
    image: chat-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PORT=${PORT:-3001}
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3001}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:$$PORT/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PORT=${PORT:-3001}
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    entrypoint: >
      /bin/sh -c "envsubst '$$PORT' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"
    depends_on:
      - chat-app
    restart: unless-stopped
